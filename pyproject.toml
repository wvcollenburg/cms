[project]
name = "createur-cms"
version = "0.1.0"
description = "CMS for Broedplaats de Createur"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "flask-migrate>=4.0",
    "flask-login>=0.6.3",
    "flask-wtf>=1.2",
    "flask-babel>=4.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "pydantic>=2.6",
    "nh3>=0.2",
    "pillow>=10.0",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "freezegun>=1.4"]
server = [
    "gunicorn>=26.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
# STRATO shared hosting (Profile B) runs Python 3.11 on glibc 2.17 with no compiler, so every
# package needs a manylinux_2_17 (manylinux2014) wheel. These are the last versions that ship one.
# Check before lifting: uv pip install --target /tmp/x --python-version 3.11
#   --python-platform x86_64-manylinux_2_17 --only-binary :all: -r <(uv export --no-dev)
constraint-dependencies = [
    "pillow<12.3",
    "argon2-cffi-bindings<22",
    "greenlet<3.3",  # SQLAlchemy pulls it in for asyncio, which we don't use
]
