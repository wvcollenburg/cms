<!doctype html>
<html lang="{% block html_lang %}{{ ui_lang }}{% endblock %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ setting('site_name', default='Broedplaats de Createur') }}{% endblock %}</title>
  {% block meta %}{% endblock %}
  {% if demo_mode or noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if demo_mode %}<div class="demo-banner" role="note">{{ _('Demo — not the real website') }}</div>{% endif %}
  {% block body %}{% endblock %}
</body>
</html>
